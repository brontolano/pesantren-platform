name: Platform v2 quality

on:
  push:
    paths:
      - 'apps/platform-v2/**'
      - 'packages/pesantren-design-system/**'
      - 'docs/v2/**'
      - 'scripts/v2-docs-check.mjs'
      - 'README-V2.md'
      - '.github/workflows/platform-v2.yml'
  pull_request:
    paths:
      - 'apps/platform-v2/**'
      - 'packages/pesantren-design-system/**'
      - 'docs/v2/**'
      - 'scripts/v2-docs-check.mjs'
      - 'README-V2.md'
      - '.github/workflows/platform-v2.yml'

permissions:
  contents: read

concurrency:
  group: platform-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: Lint and feature tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: platform_v2_test
          POSTGRES_USER: platform_v2_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_v2_test -d platform_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:VjJfQ0lfT05MWV9LRVlfTk9UX0FfU0VDUkVU
      DB_CONNECTION: central
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: platform_v2_test
      DB_USERNAME: platform_v2_test
      DB_PASSWORD: ci-only-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo, pdo_pgsql, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate and install PHP dependencies
        working-directory: apps/platform-v2
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      - name: Install Laravel Boost developer assistant
        working-directory: apps/platform-v2
        run: php artisan boost:install --no-interaction

      - name: Check formatting
        working-directory: apps/platform-v2
        run: vendor/bin/pint --test

      - name: Prepare testing environment
        working-directory: apps/platform-v2
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run migrations and feature tests
        working-directory: apps/platform-v2
        run: |
          php artisan migrate:fresh --force
          php artisan test

      - name: Set up Node
        if: hashFiles('apps/platform-v2/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        if: hashFiles('apps/platform-v2/package.json') != ''
        working-directory: apps/platform-v2
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        if: hashFiles('apps/platform-v2/package.json') != ''
        working-directory: apps/platform-v2
        run: npm run build

      - name: Save generated dependency locks for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v2-dependency-locks
          path: |
            apps/platform-v2/composer.lock
            apps/platform-v2/package-lock.json
          if-no-files-found: ignore
          retention-days: 7
