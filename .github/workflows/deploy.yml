name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' }}
    env:
      RELEASE_NAME: release-${{ github.sha }}.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=vendor \
            --exclude=storage/logs \
            --exclude=storage/framework/cache/data \
            --exclude=storage/framework/sessions \
            --exclude=storage/framework/views \
            --exclude=.env \
            -czf "$RELEASE_NAME" .

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ${{ env.RELEASE_NAME }}
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.VPS_PATH }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_PATH,RELEASE_NAME
          script_stop: true
          script: |
            set -e

            mkdir -p "$APP_PATH/current" "$APP_PATH/shared/storage"
            if [ ! -f "$APP_PATH/shared/.env" ]; then
              echo "Missing production env file at $APP_PATH/shared/.env"
              exit 1
            fi

            rm -rf "$APP_PATH/current"/*
            tar -xzf "/tmp/$RELEASE_NAME" -C "$APP_PATH/current"

            rm -rf "$APP_PATH/current/storage"
            ln -sfn "$APP_PATH/shared/storage" "$APP_PATH/current/storage"
            cp "$APP_PATH/shared/.env" "$APP_PATH/current/.env"

            cd "$APP_PATH/current"

            docker compose up -d --build
            docker compose exec -T app composer install --no-interaction --prefer-dist --optimize-autoloader
            docker compose exec -T app npm install --no-audit --no-fund
            docker compose exec -T app npm run build
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app php artisan event:cache
            docker compose exec -T app php artisan filament:cache-components
            docker compose exec -T app php artisan icons:cache

            rm -f "/tmp/$RELEASE_NAME"
