name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Rsync source to VPS
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10"
          ok=0
          for i in 1 2 3 4 5; do
            rsync -az \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'node_modules' \
              --exclude 'vendor' \
              --exclude '.env' \
              --exclude 'storage/app' \
              --exclude 'storage/logs' \
              --exclude 'storage/framework' \
              -e "ssh $SSH_OPTS" \
              ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/pesantren-platform/" && { ok=1; break; }
            echo "Rsync percobaan $i gagal, ulang dalam 20s..."
            sleep 20
          done
          [ "$ok" = 1 ]

      - name: Build, restart & migrate
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10"
          ok=0
          for i in 1 2 3 4 5; do
            ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
              set -e
              cd /opt/pesantren-platform
              docker compose -f docker-compose.production.yml build app
              docker compose -f docker-compose.production.yml up -d --force-recreate app
              sleep 10
              docker compose -f docker-compose.production.yml exec -T app php artisan migrate --force
              docker compose -f docker-compose.production.yml exec -T app php artisan optimize:clear
              echo "Deploy selesai."
            ' && { ok=1; break; }
            echo "SSH percobaan $i gagal, ulang dalam 20s..."
            sleep 20
          done
          [ "$ok" = 1 ]
