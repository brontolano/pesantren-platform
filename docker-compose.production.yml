# docker-compose.production.yml
# FrankenPHP handles SSL directly via Caddy — no Traefik needed
# Usage: docker compose -f docker-compose.production.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pesantren-platform-app:latest
    container_name: pesantren-app
    restart: unless-stopped
    # Healthcheck ANTI insiden 2026-06-30 (HTTP 200 body 0-byte): Caddy hidup tapi
    # runtime PHP FrankenPHP mati → status 200 saja TIDAK cukup. Cek body NON-KOSONG
    # dari /up (endpoint health Laravel, dieksekusi PHP, tanpa sentuh DB tenant).
    # wget dipakai (terpasang pasti di image, lihat Dockerfile); grep -q . gagal
    # bila body kosong → container ditandai unhealthy → di-restart oleh autoheal.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - autoheal=true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - SERVER_NAME=:80
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
      - ./.env:/app/.env:ro
      - caddy_data:/data
      - caddy_config:/config
      # Route tenant dedicated (T2 #342) — file include per tenant, reload tanpa rebuild
      - ./caddy/tenants:/etc/caddy/tenants:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Autoheal: restart otomatis container unhealthy ──
  # Docker/Compose TIDAK me-restart container yang unhealthy dengan sendirinya
  # (restart policy hanya bereaksi pada exit, bukan health). autoheal memantau
  # container berlabel autoheal=true (saat ini: pesantren-app) dan me-restart-nya
  # saat unhealthy — menggantikan `docker restart pesantren-app` manual insiden
  # 2026-06-30. Butuh akses docker.sock (read/write, hanya operasi restart).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: pesantren-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

  # ── Queue worker: OTP peserta (queue 'notifikasi') + job umum (queue 'default') ──
  # Pakai image hasil build service `app` (kode sama). Tanpa worker, semua job antrian menumpuk.
  worker:
    image: pesantren-platform-app:latest
    container_name: pesantren-worker
    restart: unless-stopped
    command: php artisan queue:work redis --queue=notifikasi,default --sleep=3 --tries=3 --max-time=3600
    healthcheck:
      disable: true
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Queue worker KHUSUS broadcast WA (queue 'broadcast') ──
  # Job broadcast memberi jeda 10 dtk/pesan (timeout besar). Queue & worker terpisah
  # agar throttle ini TIDAK menahan OTP/notifikasi. tries=1 → tak kirim ulang duplikat.
  worker-broadcast:
    image: pesantren-platform-app:latest
    container_name: pesantren-worker-broadcast
    restart: unless-stopped
    command: php artisan queue:work redis --queue=broadcast --sleep=5 --tries=1 --timeout=7200
    healthcheck:
      disable: true
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Queue worker KHUSUS job AI (queue 'ai', koneksi 'redis-ai') ──
  # Job Ollama bisa berjalan sampai 600 dtk; koneksi redis-ai punya
  # retry_after=660 (> timeout) agar job berjalan TIDAK dilepas ulang &
  # diproses dobel (jebakan retry_after Blueprint AI §4.3).
  # SATU proses = konkurensi 1 → antrian alami untuk Ollama 2 vCPU.
  worker-ai:
    image: pesantren-platform-app:latest
    container_name: pesantren-worker-ai
    restart: unless-stopped
    command: php artisan queue:work redis-ai --queue=ai --sleep=3 --tries=2 --timeout=600
    healthcheck:
      disable: true
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── LLM lokal (Ollama) untuk Modul AI "Khadim Digital" ──
  # TIDAK diekspos keluar VPS; satu-satunya pemanggil = AiGateway (Modules/AI).
  # mem_limit/cpus dipakai (bukan deploy.resources — tak dijamin di compose non-swarm)
  # agar platform inti tidak kelaparan RAM/CPU.
  ollama:
    image: ollama/ollama:latest
    container_name: pesantren-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 4g
    cpus: 1.5
    networks:
      - internal

  postgres:
    # pgvector/pgvector:pg16 = postgres:16 resmi + extension vector (Modul AI).
    # Data dir kompatibel (PG major sama). Pasca-ganti image WAJIB REINDEX
    # (alpine/musl -> debian/glibc bisa beda collation urutan teks).
    image: pgvector/pgvector:pg16
    container_name: pesantren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pesantren_platform}
      POSTGRES_USER: ${DB_USERNAME:-pesantren}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pesantren}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: pesantren-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Website tenant: Asy-Syifaa (asy-syifaa.com) ──
  # PHP native thin-client. Source + media di /opt/asy-syifaa-website (host).
  # Routing domain + SSL ditangani Caddy di service `app` (lihat Caddyfile).
  website-php:
    image: php:8.2-fpm-alpine
    container_name: asy-syifaa-php
    restart: unless-stopped
    volumes:
      - /opt/asy-syifaa-website:/var/www/html
    networks:
      - internal

  website-nginx:
    image: nginx:alpine
    container_name: asy-syifaa-nginx
    restart: unless-stopped
    volumes:
      - /opt/asy-syifaa-website:/var/www/html:ro
      - /opt/asy-syifaa-website/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - website-php
    networks:
      - internal

  # ── Automasi: n8n (workflow) + WAHA (WhatsApp HTTP API) ──
  # UI: n8n.asy-syifaa.com / waha.asy-syifaa.com (Caddyfile). Internal:
  # platform → http://n8n:5678/webhook/ppdb-wa ; n8n → http://waha:3000
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.asy-syifaa.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=https://n8n.asy-syifaa.com/
      - N8N_EDITOR_BASE_URL=https://n8n.asy-syifaa.com/
      - N8N_PROXY_HOPS=1
      - N8N_RUNNERS_ENABLED=true
      # Izinkan Code node membaca $env (N8N_WAHA_* dipakai node "Send WAHA")
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_WAHA_BASE_URL=http://waha:3000
      - N8N_WAHA_API_KEY=${WAHA_API_KEY}
      - N8N_WAHA_SESSION=default
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - TZ=Asia/Jakarta
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - internal

  # ── Object storage S3-compatible (MinIO) — File Storage #43 ──
  # API internal http://minio:9000 (dipakai disk 's3' app). Console :9001.
  # CATATAN: data di disk VPS yang sama (uji jalur S3, bukan ekspansi kapasitas).
  minio:
    image: minio/minio:latest
    container_name: pesantren-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-pesantrenminio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

volumes:
  postgres_data:
  ollama_models:
  redis_data:
  app_storage:
  caddy_data:
  caddy_config:
  n8n_data:
  waha_sessions:
  minio_data:

networks:
  internal:
    driver: bridge
