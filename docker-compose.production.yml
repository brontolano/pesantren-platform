# docker-compose.production.yml
# FrankenPHP handles SSL directly via Caddy — no Traefik needed
# Usage: docker compose -f docker-compose.production.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pesantren-platform-app:latest
    container_name: pesantren-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - SERVER_NAME=:80
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
      - ./.env:/app/.env:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Queue worker: OTP peserta (queue 'notifikasi') + job umum (queue 'default') ──
  # Pakai image hasil build service `app` (kode sama). Tanpa worker, semua job antrian menumpuk.
  worker:
    image: pesantren-platform-app:latest
    container_name: pesantren-worker
    restart: unless-stopped
    command: php artisan queue:work redis --queue=notifikasi,default --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Queue worker KHUSUS broadcast WA (queue 'broadcast') ──
  # Job broadcast memberi jeda 10 dtk/pesan (timeout besar). Queue & worker terpisah
  # agar throttle ini TIDAK menahan OTP/notifikasi. tries=1 → tak kirim ulang duplikat.
  worker-broadcast:
    image: pesantren-platform-app:latest
    container_name: pesantren-worker-broadcast
    restart: unless-stopped
    command: php artisan queue:work redis --queue=broadcast --sleep=5 --tries=1 --timeout=7200
    env_file:
      - .env
    volumes:
      - app_storage:/app/storage
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: pesantren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pesantren_platform}
      POSTGRES_USER: ${DB_USERNAME:-pesantren}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pesantren}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: pesantren-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Website tenant: Asy-Syifaa (asy-syifaa.com) ──
  # PHP native thin-client. Source + media di /opt/asy-syifaa-website (host).
  # Routing domain + SSL ditangani Caddy di service `app` (lihat Caddyfile).
  website-php:
    image: php:8.2-fpm-alpine
    container_name: asy-syifaa-php
    restart: unless-stopped
    volumes:
      - /opt/asy-syifaa-website:/var/www/html
    networks:
      - internal

  website-nginx:
    image: nginx:alpine
    container_name: asy-syifaa-nginx
    restart: unless-stopped
    volumes:
      - /opt/asy-syifaa-website:/var/www/html:ro
      - /opt/asy-syifaa-website/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - website-php
    networks:
      - internal

  # ── Automasi: n8n (workflow) + WAHA (WhatsApp HTTP API) ──
  # UI: n8n.asy-syifaa.com / waha.asy-syifaa.com (Caddyfile). Internal:
  # platform → http://n8n:5678/webhook/ppdb-wa ; n8n → http://waha:3000
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.asy-syifaa.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=https://n8n.asy-syifaa.com/
      - N8N_EDITOR_BASE_URL=https://n8n.asy-syifaa.com/
      - N8N_PROXY_HOPS=1
      - N8N_RUNNERS_ENABLED=true
      # Izinkan Code node membaca $env (N8N_WAHA_* dipakai node "Send WAHA")
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_WAHA_BASE_URL=http://waha:3000
      - N8N_WAHA_API_KEY=${WAHA_API_KEY}
      - N8N_WAHA_SESSION=default
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - TZ=Asia/Jakarta
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  app_storage:
  caddy_data:
  caddy_config:
  n8n_data:
  waha_sessions:

networks:
  internal:
    driver: bridge
