services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pesantren-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pesantren
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=HostRegexp(`{subdomain:.+}.localhost`) || Host(`localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  postgres:
    image: postgres:16-alpine
    container_name: pesantren-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pesantren_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pesantren

  redis:
    image: redis:7-alpine
    container_name: pesantren-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pesantren

  traefik:
    image: traefik:v3.4
    container_name: pesantren-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pesantren

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: pesantren-uptime-kuma
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - pesantren

  n8n:
    image: n8nio/n8n:1.98.2
    container_name: pesantren-n8n
    restart: unless-stopped
    profiles:
      - notifikasi
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - pesantren

  waha:
    image: devlikeapro/waha:latest
    container_name: pesantren-waha
    restart: unless-stopped
    profiles:
      - notifikasi
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/waha
      WHATSAPP_HOOK_EVENTS: message,message.any,session.status
    volumes:
      - waha_data:/app/.sessions
    networks:
      - pesantren

volumes:
  postgres_data:
  redis_data:
  uptime_kuma_data:
  n8n_data:
  waha_data:

networks:
  pesantren:
    driver: bridge
