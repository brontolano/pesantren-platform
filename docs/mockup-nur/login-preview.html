<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Masuk — Pesantren Asy-Syifaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--nur:#0b6e4f;--nur-strong:#085840;--nur-tint:#ecfdf6;--gold:#c9a24a;--gold-soft:#e7d3a1;--ink:#111;--sub:#64748b;--faint:#94a3b8;--line:#efe7da;--card:#fff;--bg:#fffaf3;--grad:linear-gradient(160deg,#17a179 0%,#0b6e4f 48%,#062a20 100%);--r:16px;--sh:inset 0 0 0 1px var(--line),0 2px 4px -2px rgba(17,17,17,.06),0 12px 28px -16px rgba(17,17,17,.18);--f:'Plus Jakarta Sans',system-ui,sans-serif}
html,body{min-height:100%;font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.hero{background:var(--grad);color:#fff;padding:calc(40px + env(safe-area-inset-top)) 24px 56px;position:relative;overflow:hidden;border-bottom-left-radius:32px;border-bottom-right-radius:32px;text-align:center}
.hero-pat{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2244%22 height=%2244%22 viewBox=%220 0 44 44%22%3E%3Cg fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%221%22 opacity=%220.5%22%3E%3Crect x=%2213%22 y=%2213%22 width=%2218%22 height=%2218%22/%3E%3Crect x=%2213%22 y=%2213%22 width=%2218%22 height=%2218%22 transform=%22rotate(45 22 22)%22/%3E%3C/g%3E%3C/svg%3E");background-size:44px 44px;opacity:.10}
.hero-glow{position:absolute;left:50%;top:-60px;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(231,211,161,.25),transparent 66%)}
.brandmark{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.16);border:1px solid rgba(231,211,161,.4);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 16px;position:relative;box-shadow:0 12px 30px -14px rgba(0,0,0,.5)}
.bismillah{font-family:'Amiri',serif;font-size:1.7rem;color:var(--gold-soft);position:relative;margin-bottom:8px}
.hero h1{font-size:1.4rem;font-weight:800;position:relative}
.hero .sub{font-size:.85rem;color:#c9f2e2;margin-top:5px;position:relative;font-weight:500}
.sheet{flex:1;margin-top:-32px;background:var(--bg);border-top-left-radius:32px;border-top-right-radius:32px;position:relative;z-index:2;padding:30px 22px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px 20px}
.card-t{font-size:1.05rem;font-weight:800;text-align:center}
.card-s{font-size:.8rem;color:var(--sub);text-align:center;margin-top:3px}
form{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:.78rem;font-weight:700;margin-bottom:7px;color:var(--ink)}
.inputwrap{position:relative}
.inputwrap>.lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.inputwrap>.lead svg{width:19px;height:19px}
.field input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 44px 14px 42px;font-size:.95rem;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:var(--nur);box-shadow:0 0 0 3px rgba(11,110,79,.12)}
.field input::placeholder{color:var(--faint)}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;display:flex}
.row{display:flex;align-items:center;justify-content:space-between}
.remember{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--sub);font-weight:600;cursor:pointer}
.remember input{width:17px;height:17px;accent-color:var(--nur)}
.forgot{font-size:.8rem;color:var(--nur);font-weight:700}
.btn{appearance:none;border:none;cursor:pointer;width:100%;border-radius:9999px;padding:15px;font-size:1rem;font-weight:800;font-family:inherit;color:#fff;background:linear-gradient(135deg,#17a179,#0b6e4f);box-shadow:0 10px 22px -12px rgba(11,110,79,.7);transition:transform .15s,filter .15s;margin-top:2px}
.btn:active{transform:scale(.97)}
.divider{display:flex;align-items:center;gap:12px;margin:22px 4px 16px;color:var(--faint);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);opacity:.6}
.alt-grid{display:grid;grid-template-columns:1fr;gap:10px}
.alt{background:var(--card);border-radius:var(--r);padding:14px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.alt.row{flex-direction:row;align-items:center;gap:13px;padding:15px 16px}
.alt-ic{width:40px;height:40px;border-radius:12px;background:var(--nur-tint);color:var(--nur);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.alt .t{font-weight:700;font-size:.9rem;display:block}.alt .d{font-size:.75rem;color:var(--sub);line-height:1.3;display:block;margin-top:2px}
.alt-arrow{color:#cbd5e1;flex:0 0 auto}
footer{text-align:center;font-size:.72rem;color:var(--faint);margin-top:22px;font-weight:500}
footer a{color:var(--nur);font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:9px 8px calc(12px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -8px 24px -18px rgba(17,17,17,.3)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--faint)}
.nav a.on{color:var(--nur)}
.nav .ic{width:52px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:99px}
.nav a.on .ic{background:var(--nur-tint)}
</style></head><body>
<div class="wrap">
  <div class="hero">
    <div class="hero-pat"></div><div class="hero-glow"></div>
    <div class="brandmark">🕌</div>
    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <h1>Pesantren Asy-Syifaa</h1>
    <div class="sub">Portal Sistem Terpadu</div>
  </div>
  <div class="sheet">
    <div class="card">
      <div class="card-t">Masuk</div>
      <div class="card-s">Silakan masuk untuk melanjutkan</div>
      <form onsubmit="return false">
        <div class="field"><label>Email</label>
          <div class="inputwrap"><span class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span><input type="email" placeholder="nama@pesantren.id" autocomplete="username"></div>
        </div>
        <div class="field"><label>Kata Sandi</label>
          <div class="inputwrap"><span class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"><button type="button" class="eye" onclick="var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        </div>
        <div class="row"><label class="remember"><input type="checkbox"> Ingat saya</label><a class="forgot" href="#">Lupa sandi?</a></div>
        <button class="btn" type="submit">Masuk</button>
      </form>
    </div>
    <div class="divider">Belum punya akun?</div>
    <div class="alt-grid">
      <a class="alt row" href="#"><span class="alt-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></span><span style="flex:1"><span class="t">Pendaftaran Santri Baru (PPDB)</span><span class="d">Untuk calon santri yang ingin mendaftar</span></span><span class="alt-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></a>
    </div>
    <footer>&copy; 2026 Pesantren Asy-Syifaa &middot; <a href="#">Kebijakan Privasi</a></footer>
  </div>
</div>
