name: Pesantren.online UI package quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check verifier syntax
        run: node --check scripts/verify-package.mjs

      - name: Verify package assets and manifest
        run: node scripts/verify-package.mjs

      - name: Check PHP syntax
        run: php -l src/PesantrenDesignSystemServiceProvider.php
